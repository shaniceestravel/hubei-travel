const days=[{"title": "飞抵宜昌 · 车溪民俗", "route": "吉隆坡 ✈ 宜昌 → 车溪", "stops": ["宜昌三峡机场接机", "车溪"], "text": "搭乘航班飞往宜昌，抵达后接机前往车溪。水车转流年，一梦回车溪，探寻三峡土家梦里老家。", "meal": "午餐、晚餐", "hotel": "宜昌雅阁璞邸酒店或同等级", "note": "去程早班机，请按出团通知提前抵达机场。"}, {"title": "昭君故里 · 探秘神农架", "route": "宜昌 → 昭君故里 → 神农架", "stops": ["昭君故里", "神农祭坛", "神农架自然保护区"], "text": "探访王昭君的出生地昭君故里，感受历史人文。游览神农祭坛，了解祭祀文化，随后走进神农架自然保护区，探索北纬31°的原始秘境与森林生态。", "meal": "早餐、午餐、晚餐", "hotel": "神农架神农山庄（木鱼镇店）或同等级", "note": "参考车程：昭君故里至神农祭坛约50公里／1.5小时。"}, {"title": "天燕云海 · 房陵烟火", "route": "天燕 → 野人洞 → 西关印象", "stops": ["天燕景区", "野人洞", "西关印象"], "text": "游览天燕景区，跨彩虹桥、探燕子洞，欣赏原始森林云海。随后探访野人洞，观赏溶洞奇景，了解野人传说。走进西关印象，感受房陵文化与市井烟火。", "meal": "早餐、午餐、晚餐", "hotel": "十堰房县西关印象恰程酒店或同等级", "note": "参考车程：天燕至野人洞约65公里／1.5小时。"}, {"title": "问道武当 · 一梦入江湖", "route": "武当山 →《武当一梦》", "stops": ["太子坡", "紫霄宫", "金顶", "《武当一梦》"], "text": "游览武当山核心景观：太子坡、紫霄宫与金顶，欣赏道教古建筑和云端山景。晚间欣赏《武当一梦》，在光影与互动中感受武当文化。", "meal": "早餐、午餐、晚餐", "hotel": "武当山太极观宜汤泉度假庄园或同等级", "note": "参考车程：武当山至《武当一梦》约1.5公里／10分钟。"}, {"title": "古隆中访贤 · 漫步荆楚", "route": "南水北调 → 古隆中 → 钟祥", "stops": ["南水北调", "古隆中", "古城墙", "北街", "莫愁村"], "text": "了解南水北调工程，探访诸葛亮隐居地古隆中。漫步古城墙与北街，感受历史建筑、当地美食与古城生活。随后游览莫愁村，品味荆楚民俗。", "meal": "早餐、午餐、晚餐", "hotel": "钟祥莫愁村度假酒店或同等级", "note": "参考车程：南水北调至古隆中约130公里／2小时。"}, {"title": "明显陵 · 楚辞里的山水", "route": "钟祥 → 明显陵 → 屈原祠 → 宜昌", "stops": ["明显陵", "屈原祠"], "text": "参观世界文化遗产明显陵，欣赏“一陵两冢”的明代皇家陵寝。随后探访屈原祠，追寻爱国诗人足迹，远眺三峡大坝，了解端午文化。", "meal": "早餐、午餐、晚餐", "hotel": "宜昌雅阁璞邸酒店或同等级", "note": "参考车程：明显陵至屈原祠约220公里／3.5小时。"}, {"title": "两坝一峡 · 满载回忆归家", "route": "宜昌 → 三峡国际机场 ✈ 吉隆坡", "stops": ["两坝一峡游船", "三游洞", "国贸大厦", "CBD步行街", "二马路", "送机返程"], "text": "乘船欣赏葛洲坝及西陵峡东段风光，体验船过船闸的“水涨船高”。探访三游洞，感受文人墨客留下的文化印记。随后游览国贸大厦、CBD步行街及二马路，购物、品尝小吃，欣赏历史街区建筑。晚间送机返回吉隆坡。", "meal": "早餐、午餐、晚餐", "hotel": "温馨的家（12月12日凌晨抵达吉隆坡）", "note": "参考车程：两坝一峡至三游洞约20公里／40分钟。回程跨日抵达。"}];

function sightGallery(i){return `<section class="card"><div class="eyebrow">PLACES & MOMENTS</div><h2>沿途风景，先睹为快</h2><div class="sights">${sightPhotos[i].map(([file,label])=>`<figure class="sight"><img src="${file}.jpg" alt="${label}" loading="lazy" width="300" height="210"><figcaption>${label}</figcaption></figure>`).join('')}</div><p class="photo-credit">图片选自原行程资料，仅作景点与体验参考。</p></section>`}
const scenicPhotos=[[["车溪 · 土家老街", "https://www.topchinatravel.com/pic/city/yichang/attractions/chexi-folk-custom-scenic-area-01.jpg", "https://www.topchinatravel.com/china-attractions/yichang-chexi-folk-custom-scenic-area.htm", "Top China Travel"]], [["神农祭坛", "https://p8.itc.cn/images01/20220203/4216b5d3f7de4869a7953938eb0d4e50.jpeg", "https://www.sohu.com/a/520421888_797934", "搜狐旅游"]], [["天燕 · 彩虹桥", "https://dimg04.c-ctrip.com/images/0103j120008d1zcth5E09_W_640_10000.jpg?proc=autoorient", "https://you.ctrip.com/sight/shennongjia147/136366.html", "携程攻略"], ["天燕 · 林间步道", "https://dimg04.c-ctrip.com/images/0102v120008b5q0ka10CA_W_640_10000.jpg?proc=autoorient", "https://you.ctrip.com/sight/shennongjia147/136366.html", "携程攻略"]], [["武当山 · 金顶", "https://imagepphcloud.thepaper.cn/pph/image/285/147/656.jpg", "https://www.thepaper.cn/newsDetail_forward_25878723", "澎湃新闻·政务"], ["武当山 · 紫霄宫", "https://p3.itc.cn/q_70/images03/20221002/c37b3ca416094445800d263a99ee7af4.jpeg", "https://www.sohu.com/a/589647552_111399", "搜狐旅游"]], [["古隆中", "https://www.hlhbsc.org/Userfiles/images/201906/0606%282%29.jpg", "https://www.hlhbsc.org/news_detail.aspx?news=312", "海峡两岸旅游交流协会"], ["莫愁村 · 街巷夜色", "https://k.sinaimg.cn/n/sinakd20240503ac/408/w518h690/20240503/07cd-75cf771d00531c0e415b7c8fd020973b.jpg/w700d1q75cms.jpg?by=cms_fixed_width", "https://k.sina.com.cn/article_2879367221_ab9fa835040015qre.html", "新浪新闻"]], [["钟祥 · 明显陵", "https://img.yichangly.com/202104/21/112212281.jpg", "https://www.yichangly.com/tour/show-224.html", "宜昌旅游网"]], [["三游洞 · 临江栈道", "https://dimg04.c-ctrip.com/images/100a1f000001g3a2uAE59_W_640_10000.jpg?proc=autoorient", "https://you.ctrip.com/sight/yichang313/51725.html", "携程攻略"], ["三游洞 · 古洞碑刻", "https://dimg04.c-ctrip.com/images/10041f000001g0xu4A46F_W_640_10000.jpg?proc=autoorient", "https://you.ctrip.com/sight/yichang313/51725.html", "携程攻略"]]];
function photoGallery(i){const items=scenicPhotos[i];return `<section class="photo-section" aria-label="当日景点照片"><div class="section-label">SCENIC MOMENTS · 沿途风景</div><div class="photo-grid ${items.length>1?'multiple':''}">${items.map((p,n)=>`<figure class="photo-card"><button type="button" class="photo-open" data-photo-day="${i}" data-photo-index="${n}" aria-label="放大查看${p[0]}"><img src="${p[1]}" alt="${p[0]}景点照片" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="photo-failed">照片暂未加载，请联网后重试，或查看下方来源。</span></button><figcaption><b>${p[0]}</b><a class="photo-source" href="${p[2]}" target="_blank" rel="noopener noreferrer">图片来源：${p[3]} ↗</a></figcaption></figure>`).join('')}</div><p class="photo-hint">点击照片可放大 · 景点参考照片，季节景观以实际为准 · 图片需联网加载</p></section>`}
document.addEventListener('error',e=>{if(e.target.matches('.photo-open img'))e.target.parentElement.classList.add('failed')},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-photo-day]');if(b){const p=scenicPhotos[Number(b.dataset.photoDay)][Number(b.dataset.photoIndex)];document.querySelector('#photo-title').textContent=p[0];const img=document.querySelector('#photo-large');img.src=p[1];img.alt=p[0];const credit=document.querySelector('#photo-credit');credit.textContent='图片来源：'+p[3]+' · 景点参考照片';document.querySelector('.photo-modal').showModal()}if(e.target.id==='photo-close')document.querySelector('.photo-modal').close()});

function dayPage(i){let d=days[i];return `${summary(i)}${photoGallery(i)}<aside class="note"><b>行程提醒</b>${d.note}</aside>${map(i)}<section class="card"><div class="eyebrow">SLOW TRAVEL NOTES</div><h2>这一天，慢慢走</h2><p style="font-size:13px;color:#6e685e">${d.text}</p><ol class="timeline">${d.stops.map((s,n)=>`<li><span class="num">${n+1}</span><strong>${s}</strong></li>`).join('')}</ol></section><section class="card"><div class="eyebrow">STAY & TASTE</div><h2>吃好，也住好</h2><div class="detail"><b>餐食</b><span>${d.meal}</span></div><div class="detail"><b>住宿</b><span>${d.hotel}</span></div></section>`}
function overview(){return `<section class="card"><div class="eyebrow">OUR LITTLE GETAWAY</div><h2>七天，读一程知音湖北</h2><p>2026年12月5日 — 11日 · 7天6晚<br>吉隆坡 → 宜昌 → 神农架 → 房县 → 武当山 → 钟祥 → 宜昌 → 吉隆坡</p><aside class="note"><b>回程跨日提醒</b>12月11日23:35从宜昌起飞，12月12日04:40抵达吉隆坡。产品标注为7天6晚。</aside><div class="detail"><b>体验</b><span>两坝一峡游船 · 神农架自然保护区 · 武当山 ·《武当一梦》· 荆楚民俗</span></div><div class="detail"><b>美食</b><span>土家风味宴、特色婚宴、鱼宴、昭君家宴；具体用餐日期以旅行社安排为准。按每日餐标共6早7午7晚。</span></div><div class="detail"><b>住宿</b><span>宜昌2晚，神农架、房县、武当山、钟祥各1晚，共6晚；酒店或同级安排以最终确认为准。</span></div><div class="detail"><b>交通</b><span>2＋1座舒适大巴，一排3座。</span></div>${flight(0)}${flight(6)}<button class="wide" id="print">打印 / 保存完整行程 PDF</button></section>${days.map((d,i)=>`<section class="card"><div class="eyebrow">${dates[i]} · DAY ${i+1}</div><h3>${d.title}</h3><p class="muted">${d.route}</p><button class="subtle" data-day="${i}">查看当日行程 ↗</button></section>`).join('')}`}
function contactsPage(){return `<section class="card"><div class="eyebrow">TRAVEL CONTACTS</div><h2>旅途联系人</h2><p class="muted">认真规划，真诚相伴。好的旅行体验，不在于花哨的宣传，而在于细节的用心。品质为王，细水长流，懂你所需，珍惜每一次相遇。</p><div class="detail"><b>旅行社</b><span class="agency-name"><strong>E.S. TRAVEL (M) SDN. BHD.</strong> <strong>飞马之旅</strong></span></div><div class="detail"><b>KPL/LN</b><span>3174</span></div><div class="detail"><b>ROB</b><span>398799-K</span></div><div class="detail"><b>地址</b><span>43-F JALAN ONG KIM WEE 75300 MELAKA</span></div><div class="detail"><b>联系人</b><span>SHANICE</span></div><div class="detail"><b>电话</b><span><a href="tel:+60196266566" style="color:var(--green);font-weight:700;text-underline-offset:3px">+60196266566</a></span></div><a href="https://wa.me/60196266566" target="_blank" rel="noopener noreferrer" class="wide" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">WhatsApp SHANICE</a><p class="muted" style="margin:6px 0 12px">打开 WhatsApp 后，点击通话图标即可联系 SHANICE。</p><div class="detail"><b>领队</b><span>姓名及电话待补充</span></div><div class="detail"><b>导游</b><span>姓名及电话待补充</span></div></section>`}

function render(){tabs.hidden=view!=='trip';document.querySelector('.nav').innerHTML=navItems.map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}" aria-current="${view===id?'page':'false'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[id]}"/></svg>${label}</button>`).join('');if(view==='trip'){content.setAttribute('role','tabpanel');content.setAttribute('aria-labelledby',`date-${current}`);content.innerHTML=dayPage(current)}else{content.removeAttribute('role');content.removeAttribute('aria-labelledby');if(view==='contacts')content.innerHTML=contactsPage();if(view==='overview')content.innerHTML=overview();if(view==='pack')content.innerHTML='<section class="card"><div class="eyebrow">BEFORE WE GO</div><h2>出发前，整理行囊</h2><p class="muted">勾选状态保存在当前浏览器。12月5日早班机，请留意机场集合时间。</p>'+['护照及入境所需材料','机票与行程单','确认航空公司行李额度','充电器与充电宝','舒适步行鞋','雨具与防晒用品','个人常用物品','出发前核对航班及接送安排'].map((s,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${checks.includes(i)?'checked':''}><span>${s}</span></label>`).join('')+'</section>'}content.innerHTML+='<div class="footer">悦行·知音湖北 · 2026年12月5日出发 · 7天6晚<br>行程、酒店、餐食及交通以旅行社最终确认为准。</div>';tabs.querySelectorAll('button').forEach((b,i)=>{b.setAttribute('aria-selected',i===current);b.tabIndex=i===current?0:-1})}
dates.forEach((d,i)=>{let b=document.createElement('button');b.id=`date-${i}`;b.setAttribute('role','tab');b.setAttribute('aria-controls','content');b.innerHTML=`<b>${d}</b><small>D${i+1} · ${weekdays[i]}</small>`;b.onclick=()=>{current=i;render()};b.onkeydown=e=>{let n;if(e.key==='ArrowRight')n=(i+1)%days.length;if(e.key==='ArrowLeft')n=(i+days.length-1)%days.length;if(e.key==='Home')n=0;if(e.key==='End')n=days.length-1;if(n!==undefined){e.preventDefault();current=n;render();tabs.children[n].focus()}};tabs.append(b)});
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]'),s=e.target.closest('[data-save]'),d=e.target.closest('[data-day]');if(n){view=n.dataset.view;render();window.scrollTo(0,0)}if(s){let i=Number(s.dataset.save);saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];persist();render()}if(d){current=Number(d.dataset.day);view='trip';render();window.scrollTo(0,0)}if(e.target.id==='print')window.print()});document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let i=Number(e.target.dataset.check);checks=e.target.checked?[...new Set([...checks,i])]:checks.filter(x=>x!==i);persist()}});
window.addEventListener('beforeprint',()=>{content.innerHTML=days.map((d,i)=>dayPage(i)).join('')});window.addEventListener('afterprint',render);render();
</script></body></html>
